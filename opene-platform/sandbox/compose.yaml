# OpenE sandbox. Starta via ./sandboxctl (sätter projektnamn, portar och .env per instans).
# Isolering: opene, db och mail ligger på ett internt nät utan internetåtkomst.
# Endast proxyn publicerar portar, och bara på 127.0.0.1.
name: ${SANDBOX_PROJECT:-opene-default}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

services:
  db:
    image: ${MARIADB_IMAGE:-mariadb:11.8}
    <<: *hardening
    cap_add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
    environment:
      MARIADB_DATABASE: opene
      MARIADB_USER: opene
      MARIADB_PASSWORD: ${DB_PASSWORD:?sätt DB_PASSWORD i .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?sätt DB_ROOT_PASSWORD i .env}
    command:
      - --character-set-server=latin1
      - --collation-server=latin1_swedish_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
      - --innodb-strict-mode=OFF
      - --max-allowed-packet=64M
    volumes: [db-data:/var/lib/mysql]
    networks: [backend]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mail:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.27}
    <<: *hardening
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "2000"
    networks: [backend]

  opene:
    image: ${OPENE_IMAGE:-opene-sandbox:local}
    build:
      context: .
      dockerfile: docker/Dockerfile
    <<: *hardening
    depends_on:
      db: {condition: service_healthy}
      mail: {condition: service_started}
    environment:
      DB_HOST: db
      DB_NAME: opene
      DB_USER: opene
      DB_PASSWORD: ${DB_PASSWORD}
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SANDBOX_BASE_URL: http://127.0.0.1:${SANDBOX_HTTP_PORT:-8480}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?sätt ADMIN_PASSWORD i .env}
      CITIZEN_PASSWORD: ${CITIZEN_PASSWORD:-}
      MANAGER_PASSWORD: ${MANAGER_PASSWORD:-}
    volumes:
      - opene-files:/var/lib/opene/files
    networks: [backend]

  proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    depends_on: [opene, mail]
    volumes: [./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    ports:
      - "127.0.0.1:${SANDBOX_HTTP_PORT:-8480}:8080"
      - "127.0.0.1:${SANDBOX_MAIL_PORT:-8425}:8025"
    networks: [backend, edge]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  db-data: {}
  opene-files: {}
