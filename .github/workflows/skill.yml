name: Validate and package skill
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - run: python -m unittest discover -s tests -v
      - run: python tools/skill.py --runtime-tests --output dist/opene-platform.skill
      - uses: actions/upload-artifact@v4
        with:
          name: opene-platform-skill
          path: dist/opene-platform.skill
